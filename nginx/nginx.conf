worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    # Generate a request id if the client didn't send one.
    # $request_id is a built-in nginx variable (unique per request).
    map $http_x_request_id $req_id {
        ""      $request_id;
        default $http_x_request_id;
    }

    # Rate limit: 10 req/sec per client IP, no burst -> immediate 429 above the limit.
    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
    limit_req_status 429;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    server {
        listen 8080;

        location / {
            limit_req zone=perip nodelay;

            proxy_pass http://app:3000;

            proxy_set_header X-Request-ID $req_id;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header X-Request-ID $req_id always;
        }
    }
}
